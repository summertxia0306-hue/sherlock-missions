<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta name="theme-color" content="#0b4737">
    <title>夏洛恪英语 · 新入口</title>
    <style>
      :root { color: #123d32; background: #f7f2df; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: linear-gradient(145deg, #fff8dc, #e9f0e7); }
      main { width: min(680px, 100%); padding: 42px 28px; border-radius: 28px; background: rgba(255, 255, 255, .9); box-shadow: 0 18px 60px rgba(20, 60, 48, .12); }
      .eyebrow { margin: 0 0 14px; letter-spacing: .18em; font-weight: 800; color: #4e7468; }
      h1 { margin: 0 0 18px; font-size: clamp(34px, 8vw, 58px); line-height: 1.1; }
      p { font-size: 20px; line-height: 1.65; }
      a { display: block; margin-top: 28px; padding: 20px 24px; border-radius: 18px; color: white; background: #0b4737; text-align: center; text-decoration: none; font-size: 22px; font-weight: 800; }
      small { display: block; margin-top: 20px; color: #62766f; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">SHERLOCK ENGLISH</p>
      <h1>正式入口已迁移</h1>
      <p>课程、成绩和录音仍保存在原来的安全服务中。请从下面的新入口继续学习。</p>
      <a href="https://summertxia0306-hue.github.io/sherlock-english/">打开新的正式入口</a>
      <small>旧入口已停止提交正式结果。若从 iPad 主屏幕打开，请删除旧图标后，用新页面重新“添加到主屏幕”。</small>
    </main>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' }).catch(() => {})
      }
    </script>
  </body>
</html>
