<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body{margin:0;padding:6px 0 0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;text-align:center;-webkit-tap-highlight-color:transparent}
.micbtn{width:150px;height:150px;border-radius:50%;border:4px solid #c2410c;background:#fff7ed;font-size:60px;cursor:pointer;touch-action:manipulation;transition:transform .1s}
.micbtn:active{transform:scale(.95)}
.micbtn.rec{background:#dc2626;border-color:#7f1d1d;animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}70%{box-shadow:0 0 0 22px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}
.count{font-size:90px;font-weight:800;color:#c2410c;line-height:150px}
.hint{font-size:17px;color:#374151;margin-top:8px;min-height:24px}
.timer{font-size:22px;font-weight:700;color:#dc2626;margin-top:4px}
.err{font-size:14px;color:#a32d2d;margin-top:6px;display:none}
.row{margin-top:10px;display:none}
.row button{font-size:18px;padding:12px 20px;margin:0 8px;border-radius:14px;border:2px solid #94a3b8;background:#f8fafc;cursor:pointer;touch-action:manipulation}
.row .use{background:#16a34a;border-color:#15803d;color:#fff;font-weight:700}
audio{margin-top:10px;width:92%;max-width:380px}
</style>
</head>
<body>
<div id="stage"><button id="mic" class="micbtn" aria-label="录音">🎙️</button></div>
<div class="hint" id="hint">点红圈话筒，数完 3-2-1 再开始读</div>
<div class="timer" id="timer" style="display:none"></div>
<audio id="play" controls style="display:none"></audio>
<div class="row" id="row">
  <button id="redo">🔁 重录</button>
  <button id="use" class="use">✅ 就用这个</button>
</div>
<div class="err" id="err"></div>
<script>
"use strict";
var args = {}, state = "idle", stream = null, ctx = null, node = null, srcNode = null;
var chunks = [], mediaParts = [], mediaRecorder = null, recorderMode = null;
var inRate = 48000, timerIv = null, t0 = 0, wavB64 = null, durSec = 0, playUrl = null;

function send(t, d){ window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:t}, d||{}), "*"); }
function setValue(v){ send("streamlit:setComponentValue", {value:v, dataType:"json"}); }
function setH(){ send("streamlit:setFrameHeight", {height: document.body.scrollHeight + 10}); }

var stage=document.getElementById("stage"), mic=document.getElementById("mic"),
    hint=document.getElementById("hint"), timer=document.getElementById("timer"),
    play=document.getElementById("play"), row=document.getElementById("row"),
    err=document.getElementById("err");

function fail(msg){
  err.textContent = msg; err.style.display = "block";
  state = "idle"; render();
}
function recoverCaptureFailure(msg){
  stopTimer();
  discardMediaRecorder();
  disconnectLegacyRecorder();
  releaseStream();
  closeAudioContext();
  freshMic();
  fail(msg);
}
function render(){
  mic.classList.toggle("rec", state==="recording");
  mic.style.display = (state==="review") ? "none" : "";
  play.style.display = (state==="review") ? "" : "none";
  row.style.display = (state==="review") ? "block" : "none";
  timer.style.display = (state==="recording") ? "" : "none";
  if(state==="idle") hint.textContent = args.label || "点红圈话筒，数完 3-2-1 再开始读";
  if(state==="recording") hint.textContent = "在录啦！读完再点一下红圈停止";
  if(state==="review") hint.textContent = "听听自己的声音。满意就点绿色按钮！";
  setH();
}

function beginCountdown(){
  var n = (typeof args.countdown==="number") ? args.countdown : 3;
  if(n<=0){ startRecord(); return; }
  state="countdown";
  var show=function(){
    if(n<=0){ stage.innerHTML='<button id="mic" class="micbtn rec">🎙️</button>';
      mic=document.getElementById("mic"); mic.onclick=stopRecord; startRecord(); return; }
    stage.innerHTML='<div class="count">'+n+'</div>'; hint.textContent="准备…"; setH();
    n--; setTimeout(show, 800);
  };
  show();
}

var sink = null;
function closeAudioContext(){
  var old = ctx;
  ctx = null;
  sink = null;
  if(old && old.state !== "closed"){
    try{
      var closing = old.close();
      if(closing && closing.catch){ closing.catch(function(){}); }
    }catch(e){}
  }
}
function createFreshContext(){
  closeAudioContext();
  ctx = new (window.AudioContext||window.webkitAudioContext)();
  inRate = ctx.sampleRate;
  if(ctx.state === "suspended"){
    try{
      var resuming = ctx.resume();
      if(resuming && resuming.catch){ resuming.catch(function(){}); }
    }catch(e){}
  }
}

function startRecord(){
  state="recording"; chunks=[]; mediaParts=[]; t0=Date.now();
  try{
    if(!stream){ throw new Error("麦克风未就绪"); }
    if(window.MediaRecorder){
      var mimeType = chooseRecorderMimeType();
      mediaRecorder = mimeType
        ? new MediaRecorder(stream, {mimeType:mimeType})
        : new MediaRecorder(stream);
      recorderMode="native";
      mediaRecorder.ondataavailable=function(e){
        if(e.data && e.data.size>0) mediaParts.push(e.data);
      };
      mediaRecorder.onerror=function(){
        recoverCaptureFailure("设备录音启动失败，请重新点话筒录一次。");
      };
      mediaRecorder.start();
    }else{
      startLegacyRecord();
    }
  }catch(e){ recoverCaptureFailure("启动录音失败：" + e); return; }
  startTimer();
  render();
}

function chooseRecorderMimeType(){
  if(!window.MediaRecorder || !MediaRecorder.isTypeSupported) return "";
  var choices=["audio/mp4;codecs=mp4a.40.2", "audio/mp4",
               "audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"];
  for(var i=0;i<choices.length;i++){
    if(MediaRecorder.isTypeSupported(choices[i])) return choices[i];
  }
  return "";
}

function startLegacyRecord(){
  recorderMode="legacy";
  if(!ctx) createFreshContext();
  srcNode = ctx.createMediaStreamSource(stream);
  node = ctx.createScriptProcessor(4096, 1, 1);
  node.onaudioprocess = function(e){
    if(state!=="recording") return;
    chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  };
  if(!sink){ sink=ctx.createGain(); sink.gain.value=0; sink.connect(ctx.destination); }
  srcNode.connect(node); node.connect(sink);
}

function startTimer(){
  stopTimer();
  timer.textContent="🔴 0 秒";
  timerIv=setInterval(function(){
    if(state!=="recording"){ stopTimer(); return; }
    var sec=(Date.now()-t0)/1000;
    timer.textContent="🔴 " + sec.toFixed(0) + " 秒";
    if(sec >= (args.max_sec||20)) stopRecord();
  }, 200);
}
function stopTimer(){
  if(timerIv){ clearInterval(timerIv); timerIv=null; }
}

function stopRecord(){
  if(state!=="recording") return;
  state="processing"; hint.textContent="正在检查录音…"; stopTimer();
  durSec = (Date.now()-t0)/1000;
  if(recorderMode==="native" && mediaRecorder){
    var finishedRecorder=mediaRecorder;
    finishedRecorder.onstop=function(){
      if(mediaRecorder===finishedRecorder) mediaRecorder=null;
      finishNativeRecording(finishedRecorder);
    };
    try{ finishedRecorder.stop(); }
    catch(e){ recoverCaptureFailure("停止录音失败，请重新录一次。"); return; }
    releaseStream();
    return;
  }
  finishLegacyRecording();
}

function finishNativeRecording(finishedRecorder){
  var parts=mediaParts.slice();
  mediaParts=[]; recorderMode=null;
  releaseStream();
  if(!parts.length){
    recoverCaptureFailure("设备没有生成录音，请重新点话筒录一次。"); return;
  }
  var blob=new Blob(parts, {type:finishedRecorder.mimeType||parts[0].type||"audio/mp4"});
  blobToArrayBuffer(blob).then(function(buffer){
    var decodeCtx=new (window.AudioContext||window.webkitAudioContext)();
    return decodeAudioData(decodeCtx, buffer).then(function(audioBuffer){
      var mono=mixToMono(audioBuffer);
      var rate=audioBuffer.sampleRate;
      try{ var closing=decodeCtx.close(); if(closing&&closing.catch) closing.catch(function(){}); }
      catch(e){}
      finishSamples(mono, rate);
    }, function(error){
      try{ decodeCtx.close(); }catch(e){}
      throw error;
    });
  }).catch(function(){
    recoverCaptureFailure("设备录音解码失败，请重新录一次。");
  });
}

function blobToArrayBuffer(blob){
  if(blob.arrayBuffer) return blob.arrayBuffer();
  return new Promise(function(resolve, reject){
    var reader=new FileReader();
    reader.onload=function(){ resolve(reader.result); };
    reader.onerror=reject;
    reader.readAsArrayBuffer(blob);
  });
}

function decodeAudioData(audioContext, buffer){
  return new Promise(function(resolve, reject){
    var done=false;
    function ok(value){ if(!done){ done=true; resolve(value); } }
    function bad(error){ if(!done){ done=true; reject(error); } }
    try{
      var promise=audioContext.decodeAudioData(buffer.slice(0), ok, bad);
      if(promise && promise.then) promise.then(ok, bad);
    }catch(e){ bad(e); }
  });
}

function mixToMono(audioBuffer){
  var length=audioBuffer.length, count=audioBuffer.numberOfChannels;
  var mono=new Float32Array(length);
  for(var channel=0;channel<count;channel++){
    var data=audioBuffer.getChannelData(channel);
    for(var i=0;i<length;i++) mono[i]+=data[i]/count;
  }
  return mono;
}

function disconnectLegacyRecorder(){
  try{
    if(node){ node.onaudioprocess=null; node.disconnect(); }
    if(srcNode) srcNode.disconnect();
  }catch(e){}
  node=null; srcNode=null;
}

function finishLegacyRecording(){
  disconnectLegacyRecorder();
  releaseStream();
  closeAudioContext();
  var total=0;
  for(var i=0;i<chunks.length;i++) total+=chunks[i].length;
  var all=new Float32Array(total), offset=0;
  for(var j=0;j<chunks.length;j++){ all.set(chunks[j], offset); offset+=chunks[j].length; }
  if(hasAlternatingSilentChunks(chunks) || hasDuplicatedAudioFrames(all, inRate)){
    recoverCaptureFailure("这次录音出现断续，已自动作废。请再点一次话筒重录（不计次数）。");
    return;
  }
  finishSamples(all, inRate);
}

function finishSamples(all, rate){
  if(all.length < rate*0.4){ recoverCaptureFailure("录音太短了，重新录一次吧"); return; }
  var peak=0;
  for(var i=0;i<all.length;i++){ var a=Math.abs(all[i]); if(a>peak) peak=a; }
  if(peak < 0.01){
    recoverCaptureFailure("好像没有录到声音，再点一次话筒重试（会重新连接麦克风）");
    return;
  }
  if(hasAlternatingSilentSamples(all, rate) || hasDuplicatedAudioFrames(all, rate)){
    recoverCaptureFailure("这次录音出现断续，已自动作废。请再点一次话筒重录（不计次数）。");
    return;
  }
  var wav = encodeWav16k(all, rate);
  wavB64 = b64(wav);
  if(playUrl) URL.revokeObjectURL(playUrl);
  playUrl = URL.createObjectURL(new Blob([wav], {type:"audio/wav"}));
  play.src = playUrl;
  state="review";
  stage.innerHTML='<button id="mic" class="micbtn" style="display:none">🎙️</button>';
  mic=document.getElementById("mic");
  render();
}

function frameCorrelation(samples, startA, startB, size){
  var meanA=0, meanB=0, i;
  for(i=0;i<size;i++){ meanA+=samples[startA+i]; meanB+=samples[startB+i]; }
  meanA/=size; meanB/=size;
  var cross=0, powerA=0, powerB=0;
  for(i=0;i<size;i++){
    var a=samples[startA+i]-meanA, b=samples[startB+i]-meanB;
    cross+=a*b; powerA+=a*a; powerB+=b*b;
  }
  if(powerA/size<0.000009 || powerB/size<0.000009) return null;
  return cross/Math.sqrt(powerA*powerB);
}

function hasDuplicatedAudioFrames(samples, rate){
  // 2026-09-10 真机坏录音：4096 输入帧按相邻对重复，听感为结巴/断续。
  var sizes=[Math.round(rate*4096/48000), Math.round(rate*4096/44100)];
  for(var s=0;s<sizes.length;s++){
    var size=sizes[s], frameCount=Math.floor(samples.length/size);
    if(frameCount<10) continue;
    var hits=[0,0], pairs=[0,0];
    for(var index=1;index<frameCount;index++){
      var parity=index%2; pairs[parity]++;
      var correlation=frameCorrelation(samples, (index-1)*size, index*size, size);
      if(correlation!==null && correlation>=0.95) hits[parity]++;
    }
    for(var parity=0;parity<2;parity++){
      var other=1-parity;
      if(hits[parity]>=5 && hits[parity]/pairs[parity]>=0.35
          && hits[other]<=Math.max(2, Math.floor(hits[parity]/5))) return true;
    }
  }
  return false;
}

function hasAlternatingSilentSamples(samples, rate){
  var runs=[], runStart=-1;
  for(var index=0;index<samples.length;index++){
    if(Math.abs(samples[index])<0.00004 && runStart<0) runStart=index;
    else if(Math.abs(samples[index])>=0.00004 && runStart>=0){
      runs.push([runStart, index-runStart]); runStart=-1;
    }
  }
  if(runStart>=0) runs.push([runStart, samples.length-runStart]);
  var sizes=[Math.round(rate*4096/48000), Math.round(rate*4096/44100)];
  for(var s=0;s<sizes.length;s++){
    var size=sizes[s], candidates=[];
    for(var r=0;r<runs.length;r++){
      if(runs[r][1]>=size*0.55 && runs[r][1]<=size*1.35) candidates.push(runs[r]);
    }
    if(candidates.length<4) continue;
    var regular=0;
    for(var i=1;i<candidates.length;i++){
      if(Math.abs(candidates[i][0]-candidates[i-1][0]-2*size)<=size*0.30) regular++;
    }
    if(regular>=3 && regular/(candidates.length-1)>=0.65) return true;
  }
  return false;
}

function hasAlternatingSilentChunks(parts){
  // 2026-09-08 iPad 故障证据：4096 采样的全零块与有声块严格交替。
  // 只拦截高规律性的交替模式，普通停顿和句首静音不会命中。
  if(!parts || parts.length < 8) return false;
  var silent = [], silentCount = 0;
  for(var i=0;i<parts.length;i++){
    var peak=0, part=parts[i];
    for(var j=0;j<part.length;j++){
      var value=Math.abs(part[j]);
      if(value>peak) peak=value;
    }
    var isSilent = peak < 0.000001;
    silent.push(isSilent);
    if(isSilent) silentCount++;
  }
  var voicedCount = silent.length-silentCount;
  if(silentCount < 4 || voicedCount < 4) return false;
  var ratio=silentCount/silent.length;
  if(ratio < 0.30 || ratio > 0.70) return false;
  var transitions=0;
  for(var k=1;k<silent.length;k++){
    if(silent[k] !== silent[k-1]) transitions++;
  }
  return transitions/(silent.length-1) >= 0.75;
}

function encodeWav16k(f32, rate){
  var ratio = rate/16000, n = Math.floor(f32.length/ratio);
  var pcm = new Int16Array(n);
  for(var i=0;i<n;i++){
    var pos=i*ratio, j=Math.floor(pos), fr=pos-j;
    var v = (j+1<f32.length) ? f32[j]*(1-fr)+f32[j+1]*fr : f32[j];
    v = Math.max(-1, Math.min(1, v));
    pcm[i] = v<0 ? v*0x8000 : v*0x7FFF;
  }
  var buf=new ArrayBuffer(44+pcm.length*2), dv=new DataView(buf);
  function ws(o,s){ for(var k=0;k<s.length;k++) dv.setUint8(o+k, s.charCodeAt(k)); }
  ws(0,"RIFF"); dv.setUint32(4,36+pcm.length*2,true); ws(8,"WAVE"); ws(12,"fmt ");
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,16000,true); dv.setUint32(28,32000,true);
  dv.setUint16(32,2,true); dv.setUint16(34,16,true); ws(36,"data");
  dv.setUint32(40,pcm.length*2,true);
  new Int16Array(buf,44).set(pcm);
  return buf;
}
function b64(buf){
  var u8=new Uint8Array(buf), s="", CH=0x8000;
  for(var i=0;i<u8.length;i+=CH) s+=String.fromCharCode.apply(null, u8.subarray(i,i+CH));
  return btoa(s);
}

function releaseStream(){
  if(stream){
    try{ stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
    stream = null;
  }
}
function discardMediaRecorder(){
  var old=mediaRecorder;
  mediaRecorder=null; mediaParts=[]; recorderMode=null;
  if(old && old.state!=="inactive"){
    old.ondataavailable=null; old.onstop=null; old.onerror=null;
    try{ old.stop(); }catch(e){}
  }
}
function cancelActiveRecording(){
  stopTimer(); discardMediaRecorder(); disconnectLegacyRecorder();
  releaseStream(); closeAudioContext();
}
function onMicTap(){
  err.style.display="none";
  if(state==="recording"){ stopRecord(); return; }
  if(state!=="idle") return;
  releaseStream();
  // 极老浏览器兼容回退才需要 ScriptProcessor；必须在用户手势内先建上下文。
  if(!window.MediaRecorder){
    try{ createFreshContext(); }catch(e){ recoverCaptureFailure("启动录音失败：" + e); return; }
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    recoverCaptureFailure("这个浏览器不支持录音"); return; }
  navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,
                                               noiseSuppression:true,autoGainControl:true}}).then(function(s){
    stream = s; beginCountdown();
  }).catch(function(){
    recoverCaptureFailure("需要麦克风权限才能录音。请点允许，或让爸爸妈妈在设置里打开。");
  });
}
function freshMic(){
  stage.innerHTML='<button id="mic" class="micbtn">🎙️</button>';
  mic=document.getElementById("mic");
  mic.onclick=onMicTap;
}
mic.onclick=onMicTap;
document.getElementById("redo").onclick = function(){
  if(playUrl){ URL.revokeObjectURL(playUrl); playUrl=null; }
  wavB64=null; state="idle"; freshMic(); render();
};
document.getElementById("use").onclick = function(){
  if(!wavB64) return;
  setValue({qid: args.qid, take: args.take||1, dur: Math.round(durSec*10)/10, wav_b64: wavB64});
  hint.textContent = "已交给老师评分…";
  row.style.display="none"; setH();
};

var curSig = null;
window.addEventListener("message", function(e){
  var d=e.data;
  if(!d || d.type!=="streamlit:render") return;
  args = d.args || {};
  // qid/take 变化 = 切到新题或新录次；释放上一录次全部音频资源。
  var sig = String(args.qid) + "|" + String(args.take);
  if (sig !== curSig){
    curSig = sig;
    wavB64 = null;
    cancelActiveRecording();
    state = "idle";
    freshMic();
  }
  render();
});
window.addEventListener("pagehide", function(){ cancelActiveRecording(); });
send("streamlit:componentReady", {apiVersion:1});
setH();
</script>
</body>
</html>
